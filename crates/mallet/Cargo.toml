[package]
name = "mallet"
description = "A Hammer-style level editor for Source engine VMF maps."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
mallet-vmf.workspace = true
glam.workspace = true
eframe.workspace = true
rfd.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
tiny-skia = "0.11"
base64 = "0.22"
mallet-content.workspace = true
bytemuck = { version = "1", features = ["derive"] }
egui-phosphor = "0.9"

[build-dependencies]
embed-resource = "3"
